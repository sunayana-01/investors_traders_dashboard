# Settings for the whole project.
# Everything that changes the results lives in this file, so a short hash of it
# is saved next to every result (see config_hash in config.py).

project:
  seed: 42                      # used by the bootstrap so results can be repeated
  data_dir: data                # downloaded prices are saved in data/raw
  results_dir: results          # cached results are saved in results/cache

data:
  start_date: "1999-01-01"
  market_reference_tickers: [SPY, IEF]   # always downloaded. SPY also gives us the trading calendar
  vix_ticker: "^VIX"
  fred_base_url: "https://fred.stlouisfed.org/graph/fredgraph.csv"   # free, no API key
  fred_series:
    # lag_days = how many trading days after its date a value becomes public
    # ffill_limit = how many days an old value may be carried forward
    curve_slope:   {id: T10Y2Y, lag_days: 1, ffill_limit: 5}
    credit_spread: {id: BAA10Y, lag_days: 1, ffill_limit: 5}
    fin_stress:    {id: NFCI,   lag_days: 5, ffill_limit: 10}   # weekly series
    tbill_3m:      {id: DTB3,   lag_days: 1, ffill_limit: 5}    # percent per year, used as the cash return
  max_abs_return_flag: 0.25     # a daily move bigger than 25% is flagged for a manual check
  max_assets: 10
  min_common_history_years: 8   # a portfolio needs at least this many years where all its assets exist

# The three benchmark portfolios, fixed before looking at any results.
# Portfolios typed in by the user in the dashboard are only exploratory.
portfolios:
  P1: {label: "60/30/10 SPY/IEF/GLD",             weights: {SPY: 0.60, IEF: 0.30, GLD: 0.10}}
  P2: {label: "100% SPY",                         weights: {SPY: 1.00}}
  P3: {label: "Equal-weight SPY/EFA/IEF/GLD/VNQ", weights: {SPY: 0.20, EFA: 0.20, IEF: 0.20, GLD: 0.20, VNQ: 0.20}}

labels:
  horizons: [5, 10, 21, 42, 63]       # trading days
  primary_horizon: 21                 # the main horizon, chosen in advance
  quantile: 0.75                      # "elevated" = above the 75th percentile of past volatility
  min_threshold_history_days: 504     # the first 504 days of a portfolio get no label (about 2 years)

validation:
  holdout_start: "2019-01-01"         # everything before this date is the development period
  test_block_days: 126                # each walk-forward test block is about 6 months
  min_train_days: 756                 # the first model is trained on at least 3 years
  calibration_fraction: 0.20          # the last 20% of each training window is used to calibrate

calibration:
  candidates: [none, platt, isotonic]
  selected:
    B1: platt
    B2: none
    B3: none
    B4: none
    B5: isotonic
    M1: none
    M2: none
    M3: isotonic
    M3H: platt
    M4: none

inference:
  bootstrap_reps: 2000

overlay:
  rule_a: {threshold: 0.4, reduced_exposure: 0.5}   # null means "use 0.5"
  rule_b: {kappa: 1.0, min_exposure: 0.2}
  cost_bps: 5
  execution_delay_days: 1             # the main result waits one extra day before acting

trust:
  disagreement_threshold: 0.25        # models differ by more than 25 points
  ood_z_threshold: 4.0                # an input is 4+ standard deviations from its past
  calibration_window_days: 504
  near_threshold_band: 0.05           # forecast is within 5 points of the Rule A threshold
